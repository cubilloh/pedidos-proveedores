<style>
/* Layout: sticky search header · product cards (one per flavor/variant) grouped by catalog family · fixed order bar + review drawer */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#17202b; --muted:#66707d; --line:#dde3eb;
  --accent:#1f5fae; --accent-ink:#ffffff; --accent-soft:#e6eefa; --ok:#1f7a4a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1b212a; --ink:#eef2f7; --muted:#97a1ad; --line:#2d3643;
  --accent:#6fa8ff; --accent-ink:#1a0d0f; --accent-soft:#1b2a40; --ok:#5fcf93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1b212a; --ink:#eef2f7; --muted:#97a1ad; --line:#2d3643;
  --accent:#6fa8ff; --accent-ink:#1a0d0f; --accent-soft:#1b2a40; --ok:#5fcf93; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-bottom:96px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:13px}
.search{display:flex;gap:8px;padding-block:4px 8px}
.search input[type=search]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.toggle{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;color:var(--muted);padding-inline:4px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding-block:14px}
.sec{padding-block:10px 18px}
.sec h2{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:6px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-wrap:balance}
.sec h2 small{font-family:var(--body);font-weight:500;font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted)}
.sec h2 .pgl{border:0;background:none;padding:0;color:var(--accent);font:600 13px var(--body);cursor:zoom-in;text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sap{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px;border:0;cursor:zoom-in;width:100%}
.ph img{max-width:100%;max-height:100%;object-fit:contain}
.ph .ld{width:40%;aspect-ratio:1;border-radius:50%;background:var(--line);opacity:.5}
.cb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600;line-height:1.25}
.sub{color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;margin-top:auto}
.step button{flex:none;width:40px;height:38px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--accent)}
.step button:disabled{color:var(--line);cursor:default}
.step input{flex:1;min-width:0;width:40px;height:38px;border:0;text-align:center;background:none;font-variant-numeric:tabular-nums;font-weight:600;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.card.on .step{border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.oi .step{margin:0;width:128px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cb{padding:6px 8px 8px}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.bar .sum{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.bar .sum b{font-family:var(--display);font-size:22px;letter-spacing:.02em}
.bar .sum small{display:block;opacity:.75;font-size:12px}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,5,6,.55);display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--display);font-size:22px;text-transform:uppercase;margin:0}
.x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.dl{flex:1;overflow:auto;padding:4px 16px}
.oi{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.oi .price{min-width:80px}
.df{border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.total b{font-family:var(--display);font-size:28px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 140px}
.msg{font-size:13px;color:var(--ok);min-height:1.2em}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,5,6,.85);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-height:100%;max-width:100%;border-radius:6px}
.disc{color:var(--muted);font-size:12px;padding-block:18px}
@media (max-width:560px){h1{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s}}
</style>
<style>input,select,textarea{font-size:16px!important}.step input{font-size:16px!important}</style>

</head>

NE 750ML /12","c":"Bacardí","bx":"12"},{"id":"188-1000008634","pg":188,"sap":"1000008634","n":"Sľ .GERMAIN 700ML/6","c":"Bacardí","bx":"6"},{"id":"188-1000008522","pg":188,"sap":"1000008522","n":"MARTINI ROSSO VERMOUTH750 ML/ 6","c":"Bacardí","bx":"6"},{"id":"188-1000008459","pg":188,"sap":"1000008459","n":"MARTINI SPARKLING ROSE 750 ML/ 6","c":"Bacardí","bx":"6"}];
const BRANDS = ["Todas", ...[...new Set(ITEMS.map(i => i.c))]];
const KEY = "pedido-dipo-v1";
const PHOTOS = {}; const CHUNKS = 8;
let order = {};
try { order = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { order = {}; }
let cat = "Todas", q = "", only = false;
const $ = s => document.querySelector(s);
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(order)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chips() { $("#chips").innerHTML = BRANDS.map(c => `<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join(""); }
function matches(i) {
  if (cat !== "Todas" && i.c !== cat) return false;
  if (only && !(order[i.id] > 0)) return false;
  if (q) { const h = norm(i.n + " " + i.sap + " " + i.c); return norm(q).split(/\s+/).every(t => h.includes(t)); }
  return true;
}
function itemHTML(i) {
  const n = order[i.id] || 0, src = PHOTOS[i.id];
  return `<article class="card${n>0?" on":""}" data-id="${i.id}">
    <button class="ph" data-zoom="${i.id}" aria-label="Ver foto de ${esc(i.n)}">${src?`<img src="${src}" alt="${esc(i.n)}">`:`<span class="ld"></span>`}</button>
    <div class="cb">
      <div class="name">${esc(i.n)}</div>
      <div class="sub"><span class="sap">SAP ${esc(i.sap)}</span><span>pág. ${i.pg}</span></div>
      <div class="step"><button data-d="-1" aria-label="Menos" ${n>0?"":"disabled"}>−</button><input id="q-${i.id}" inputmode="numeric" value="${n||""}" placeholder="0" aria-label="Cantidad de ${esc(i.n)}"><button data-d="1" aria-label="Más">+</button></div>
    </div></article>`;
}
function render() {
  const vis = ITEMS.filter(matches);
  const groups = [];
  vis.forEach(i => { if (!groups.length || groups[groups.length-1].c !== i.c) groups.push({c:i.c, list:[]}); groups[groups.length-1].list.push(i); });
  $("#list").innerHTML = groups.length ? groups.map(G => `<section class="sec"><h2>${esc(G.c)} <small>${G.list.length} producto${G.list.length>1?"s":""}</small></h2>
      <div class="grid">${G.list.map(itemHTML).join("")}</div></section>`).join("")
    : `<div class="empty">${only?"Todavía no has agregado productos.":"No hay productos que coincidan con la búsqueda."}</div>`;
  $("#count").textContent = vis.length + " de " + ITEMS.length + " productos";
  totals();
}
function loadPhotos() {
  for (let k = 0; k < CHUNKS; k++) {
    fetch("fotos/f" + k + ".json").then(r => r.json()).then(m => {
      Object.assign(PHOTOS, m);
      for (const id in m) document.querySelectorAll(`.card[data-id="${id}"] .ph`).forEach(el => { el.innerHTML = `<img src="${m[id]}" alt="${esc(byId[id].n)}">`; });
    }).catch(() => {});
  }
}
function lines() { return ITEMS.filter(i => order[i.id] > 0).map(i => ({...i, q: order[i.id]})); }
function totals() {
  const L = lines(); const u = L.reduce((s,l)=>s+l.q,0);
  $("#bTotal").textContent = u + (u === 1 ? " bulto" : " bultos");
  $("#bInfo").textContent = L.length ? `${L.length} producto${L.length>1?"s":""} distintos` : "Nada seleccionado aún";
  $("#open").disabled = !L.length;
  $("#oTotal").textContent = u + " bultos";
  $("#oInfo").textContent = `${L.length} productos`;
}
function setQty(id, n, rerender = true) {
  n = Math.max(0, Math.min(9999, parseInt(n) || 0));
  if (n > 0) order[id] = n; else delete order[id];
  save();
  if (rerender) document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el => { el.outerHTML = itemHTML(byId[id]); });
  totals();
}
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; cat = b.dataset.c; chips(); render(); window.scrollTo({top:0}); });
$("#q").addEventListener("input", e => { q = e.target.value.trim(); render(); });
$("#only").addEventListener("change", e => { only = e.target.checked; render(); });
$("#list").addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]"); if (z) { const s = PHOTOS[z.dataset.zoom]; if (s) { $("#lbImg").src = s; $("#lbImg").alt = byId[z.dataset.zoom].n; $("#lb").hidden = false; } return; }
  const b = e.target.closest(".step button"); if (!b) return;
  const id = b.closest(".card").dataset.id;
  setQty(id, (order[id] || 0) + Number(b.dataset.d));
  document.querySelector(`.card[data-id="${id}"] button[data-d="${b.dataset.d}"]`)?.focus();
});
$("#list").addEventListener("change", e => { if (e.target.id.startsWith("q-")) setQty(e.target.id.slice(2), e.target.value); });
$("#list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id.startsWith("q-")) e.target.blur(); });
$("#lb").addEventListener("click", () => $("#lb").hidden = true);

function drawOrder() {
  const L = lines();
  $("#olist").innerHTML = L.length ? L.map(l => `<div class="oi" data-id="${l.id}">
    <div><div class="name">${esc(l.n)}</div><div class="sub"><span class="sap">SAP ${esc(l.sap)}</span><span>${esc(l.c)}</span></div></div>
    <div class="step"><button data-d="-1" aria-label="Menos">−</button><input id="o-${l.id}" inputmode="numeric" value="${l.q}" aria-label="Cantidad"><button data-d="1" aria-label="Más">+</button></div>
    <div></div></div>`).join("") : `<div class="empty">El pedido está vacío.</div>`;
  ["#xlsx","#pdf","#copy"].forEach(s => $(s).disabled = !L.length);
}
function openOrder(){ drawOrder(); $("#msg").textContent=""; $("#fallback").hidden = true; resetClear(); $("#ov").hidden = false; $("#close").focus(); }
function closeOrder(){ $("#ov").hidden = true; render(); }
$("#open").onclick = openOrder;
$("#close").onclick = closeOrder;
$("#ov").addEventListener("click", e => { if (e.target.id === "ov") closeOrder(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#lb").hidden) $("#lb").hidden = true; else if (!$("#ov").hidden) closeOrder(); } });
$("#olist").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const id = b.closest(".oi").dataset.id; setQty(id, (order[id]||0) + Number(b.dataset.d), false); drawOrder(); resetClear(); });
$("#olist").addEventListener("change", e => { if (e.target.id.startsWith("o-")) { setQty(e.target.id.slice(2), e.target.value, false); drawOrder(); resetClear(); } });

const today = () => new Date().toLocaleDateString("es-CR", {day:"2-digit", month:"2-digit", year:"numeric"});
const stamp = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function offer(filename, data) {
  try { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); $("#msg").textContent = "Archivo descargado: " + filename;
  } catch (e) { $("#msg").textContent = "No se pudo descargar el archivo."; }
}
$("#xlsx").onclick = () => {
  const L = lines(); const rows = [["Pedido Grupo Dipo · " + today()], [], ["Código SAP","Producto","Marca","Cantidad (bultos)"]];
  L.forEach(l => rows.push([l.sap, l.n, l.c, l.q]));
  const last = L.length + 3;
  rows.push([], ["","","Total", {f:`SUM(D4:D${last})`, v:L.reduce((s,l)=>s+l.q,0)}]);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:13},{wch:50},{wch:24},{wch:16}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Pedido");
  offer("Pedido Dipo " + stamp() + ".xlsx", new Blob([XLSX.write(wb, {bookType:"xlsx", type:"array"})]));
};
$("#pdf").onclick = () => {
  const L = lines(); const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:"pt", format:"letter"});
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Pedido - Grupo Dipo", 40, 50);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("Fecha: " + today(), 40, 68);
  doc.autoTable({ startY: 84, head: [["Código SAP","Producto","Marca","Cant."]],
    body: L.map(l => [l.sap, l.n, l.c, l.q]),
    foot: [["","","Total", L.reduce((s,l)=>s+l.q,0)]],
    styles:{fontSize:9, cellPadding:4}, headStyles:{fillColor:[31,95,174]}, footStyles:{fillColor:[234,239,246], textColor:20, fontStyle:"bold"},
    columnStyles:{0:{cellWidth:72},3:{halign:"right",cellWidth:44}} });
  offer("Pedido Dipo " + stamp() + ".pdf", doc.output("blob"));
};
function asText() {
  const L = lines();
  return "*Pedido Grupo Dipo* · " + today() + "\n\n" + L.map(l => `• ${l.q} × ${l.n} (SAP ${l.sap})`).join("\n") + `\n\nTotal: ${L.reduce((s,l)=>s+l.q,0)} bultos`;
}
$("#copy").onclick = () => {
  const t = asText();
  const fb = () => { const ta = $("#fallback"); ta.value = t; ta.hidden = false; ta.focus(); ta.select(); $("#msg").textContent = "Selecciona y copia el texto de abajo."; };
  try { navigator.clipboard.writeText(t).then(() => $("#msg").textContent = "Copiado. Pégalo en WhatsApp.", fb); } catch (e) { fb(); }
};
function resetClear(){ $("#clearBox").innerHTML = `<button class="btn ghost" id="clear">Vaciar pedido</button>`; $("#clear").onclick = askClear; $("#clear").disabled = !lines().length; }
function askClear(){ $("#clearBox").innerHTML = `<span>¿Borrar todo el pedido?</span><button class="btn" id="yes">Sí, vaciar</button><button class="btn ghost" id="no">Cancelar</button>`;
  $("#yes").onclick = () => { order = {}; save(); drawOrder(); totals(); resetClear(); $("#msg").textContent = "Pedido vaciado."; };
  $("#no").onclick = resetClear; }
chips(); render(); loadPhotos();
</script>
